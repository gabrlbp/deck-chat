appId: dev.gbr.deckchat
productName: Deck Chat
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
    - zip
  # sem assinatura (uso pessoal). Também permite gerar o build no Linux sem wine.
  signAndEditExecutable: false
  artifactName: Deck-Chat-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Deck-Chat-Setup-${version}.${ext}
publish: null
