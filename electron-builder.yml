appId: dev.gbr.deckchat
productName: Deck Chat
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/*.png
  - package.json
asar: true
# ícones da janela e da bandeja lidos direto do disco (importados com ?asset no main)
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - zip
  icon: resources/icon.ico
  # sem assinatura de código (uso pessoal), mas com ícone e versão gravados no .exe (rcedit).
  # No Linux o rcedit precisaria de wine: `npm run dist:win:zip` desliga a edição do .exe.
  signExecutable: false
  artifactName: Deck-Chat-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Deck-Chat-Setup-${version}.${ext}
publish:
  provider: github
  owner: gabrlbp
  repo: deck-chat
  releaseType: release
